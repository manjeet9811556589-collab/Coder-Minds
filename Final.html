<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Threat Analyzer + AI Assistant</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle,#06130c,#020705);
  font-family:'Orbitron',monospace;
  color:#00ff88;
}
.wrapper{display:flex;gap:20px;padding:40px;max-width:1200px;margin:auto}
.column{flex:1;border:1px solid #00ff8855;padding:20px;border-radius:16px;background:#020705; box-shadow: 0 0 25px rgba(0 , 255, 156, 0.4);}
.title{text-align:center;font-size:26px;margin-bottom:15px; text-shadow: 0 0 15px #00ff9c;}
input,textarea{width:95%;background:black;color:#00ff88;border:1px solid #00ff8855;padding:12px;margin-top:10px}
button{width:100%;padding:14px;margin-top:15px;background:#00ff88;border:none;font-weight:bold;cursor:pointer}
#chatBox{height:350px;overflow-y:auto;border:1px solid #00ff8855;margin-top:15px;padding:10px}
.chatMessage.user{color:#00aaff;margin-bottom:10px}
.chatMessage.bot{color:#ffbb33;margin-bottom:10px}
table{width:100%;border-collapse:collapse;margin-top:15px;display:none}
th,td{border:1px solid #00ff8855;padding:10px}
th{background:#011202}
small{color:#aaffcc}
#finalScore{margin-top:10px;display:none;font-size:16px}
</style>
</head>

<body>
<div class="wrapper">

<!-- Scanner -->
<div class="column">
<div class="title">⚡ AI Vulnerability Scanner</div>
<input id="urlInput" placeholder="Enter website URL">
<button onclick="runScan()">RUN RISK ANALYSIS. REFRESH PAGE TO PREDICT FOR NEW URL.</button>

<table id="predictionTable">
<thead>
<tr>
<th>Vulnerability</th>
<th>Prediction Rate</th>
<th>Fixed URL / Suggested Fix</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="finalScore"></div>
</div>

<!-- AI -->
<div class="column">
<div class="title">🤖 Smart AI Assistant</div>
<textarea id="userQuery" placeholder="Ask anything about vulnerabilities, causes, fixes or impact..."></textarea>
<button onclick="askAI()">ASK AI</button>
<div id="chatBox"></div>
</div>

</div>

<script>
/* ---------------- VULNERABILITIES ---------------- */
const vulns=[
"SQL Injection","XSS","Broken Authentication","Sensitive Data Exposure",
"XXE","Broken Access Control","Security Misconfiguration",
"CSRF","Vulnerable Components","Insufficient Logging"
];

const vulnInfo={
"SQL Injection":{
 desc:"SQL Injection allows attackers to manipulate database queries using unsanitized input.",
 cause:"Occurs when user input is directly concatenated into SQL queries.",
 fix:"Use prepared statements and parameterized queries.",
 impact:"Prevents data theft, data corruption, and full database compromise."
},
"XSS":{
 desc:"XSS allows attackers to inject malicious scripts into webpages viewed by users.",
 cause:"Occurs due to improper input validation or output encoding.",
 fix:"Sanitize inputs and encode outputs.",
 impact:"Protects user sessions, cookies, and trust."
},
"Broken Authentication":{
 desc:"Broken authentication allows attackers to take over user accounts.",
 cause:"Weak passwords, insecure session handling, missing MFA.",
 fix:"Use MFA, strong password hashing, and secure sessions.",
 impact:"Prevents account hijacking and identity theft."
},
"Sensitive Data Exposure":{
 desc:"Sensitive data is exposed when encryption is missing or weak.",
 cause:"Using HTTP, weak crypto, or storing secrets in URLs.",
 fix:"Use HTTPS and encrypt sensitive data.",
 impact:"Protects user privacy and compliance."
},
"XXE":{
 desc:"XXE allows attackers to access internal files via XML parsers.",
 cause:"External entities enabled in XML processing.",
 fix:"Disable external entity processing.",
 impact:"Stops file disclosure and SSRF attacks."
},
"Broken Access Control":{
 desc:"Users gain access to unauthorized resources.",
 cause:"Missing server-side authorization checks.",
 fix:"Enforce role-based access control.",
 impact:"Prevents privilege escalation."
},
"Security Misconfiguration":{
 desc:"Insecure default configurations expose the system.",
 cause:"Default credentials, open ports, missing headers.",
 fix:"Harden server and security configurations.",
 impact:"Reduces attack surface."
},
"CSRF":{
 desc:"CSRF forces users to perform unwanted actions.",
 cause:"Missing CSRF tokens.",
 fix:"Use CSRF tokens and SameSite cookies.",
 impact:"Prevents unauthorized actions."
},
"Vulnerable Components":{
 desc:"Outdated libraries contain known vulnerabilities.",
 cause:"Unpatched dependencies.",
 fix:"Regularly update components.",
 impact:"Prevents known exploits."
},
"Insufficient Logging":{
 desc:"Security incidents go undetected.",
 cause:"Missing logs and alerts.",
 fix:"Implement monitoring and logging.",
 impact:"Enables faster attack detection."
}
};

/* ---------------- MODEL ---------------- */
let model=tf.sequential();
model.add(tf.layers.dense({inputShape:[8],units:128,activation:'relu'}));
model.add(tf.layers.dense({units:64,activation:'relu'}));
model.add(tf.layers.dense({units:32,activation:'relu'}));
model.add(tf.layers.dense({units:10,activation:'sigmoid'}));
model.compile({optimizer:'adam',loss:'binaryCrossentropy'});

/* ---------------- FEATURES ---------------- */
function features(url){
  const u=new URL(url);
  return[
    url.length/100,
    [...u.searchParams].length/10,
    u.protocol==="https:"?1:0,
    +u.pathname.includes("login"),
    +u.pathname.includes("admin"),
    +u.pathname.includes("api"),
    +u.pathname.includes("form"),
    url.includes("=")?1:0
  ];
}

/* ---------------- AUTO LABEL ---------------- */
function autoLabel(url){
  return vulns.map(v=>{
    if(v==="SQL Injection" && url.includes("="))return 1;
    if(v==="XSS" && url.includes("<"))return 1;
    if(v==="Broken Authentication" && url.includes("login"))return 1;
    if(v==="Security Misconfiguration" && url.startsWith("http:"))return 1;
    return 0;
  });
}

/* ---------------- TRAIN (NO REFRESH ISSUE) ---------------- */
async function train(url){
  const X=tf.tensor2d([features(url)]);
  const y=tf.tensor2d([autoLabel(url)]);
  await model.fit(X,y,{epochs:30,verbose:0});
}

/* ---------------- FIXED URL ---------------- */
function generateFixedURL(originalURL,v){
  const u=new URL(originalURL);
  switch(v){
    case "SQL Injection": u.search="?id=123"; return u+" (prepared queries)";
    case "XSS": u.search="?q=safeText"; return u+" (encoded output)";
    case "Broken Authentication": return u.origin+"/secure-login (MFA)";
    case "Sensitive Data Exposure": u.protocol="https:"; u.search=""; return u+" (HTTPS)";
    case "XXE": return u.origin+u.pathname+" (XXE disabled)";
    case "Broken Access Control": return u.origin+"/dashboard (RBAC)";
    case "Security Misconfiguration": u.protocol="https:"; return u+" (secure headers)";
    case "CSRF": return u.origin+u.pathname+" (CSRF token)";
    case "Vulnerable Components": return u.origin+u.pathname+" (updated deps)";
    case "Insufficient Logging": return u.origin+u.pathname+" (audit logs)";
    default: return originalURL;
  }
}

/* ---------------- RUN SCAN (CALIBRATED) ---------------- */
async function runScan(){
  const url=urlInput.value.trim();
  if(!url)return;

  await train(url);
  const raw=model.predict(tf.tensor2d([features(url)])).dataSync();

  predictionTable.style.display="table";
  let tbody=predictionTable.querySelector("tbody");
  tbody.innerHTML="";

  let total=0;

  raw.forEach((p,i)=>{
    let score=p;

    if(url.includes("=") && vulns[i]==="SQL Injection") score+=0.45;
    if(url.includes("<") && vulns[i]==="XSS") score+=0.5;
    if(url.includes("login") && vulns[i]==="Broken Authentication") score+=0.35;
    if(url.startsWith("http:") && vulns[i]==="Security Misconfiguration") score+=0.4;
    if(url.includes("admin") && vulns[i]==="Broken Access Control") score+=0.3;
    if(url.includes("api") && vulns[i]==="CSRF") score+=0.25;

    score=Math.min(0.95,Math.max(0.05,score));
    total+=score;

    tbody.innerHTML+=`
    <tr>
      <td><b>${vulns[i]}</b></td>
      <td>${(score*100).toFixed(1)}%</td>
      <td><small>${generateFixedURL(url,vulns[i])}</small></td>
    </tr>`;
  });

  finalScore.style.display="block";
  finalScore.innerHTML=`FINAL RISK SCORE: <b>${((total/vulns.length)*100).toFixed(1)}%</b>`;
}

/* ---------------- AI ASSISTANT (UNCHANGED) ---------------- */
function aiReply(msg){
  msg=msg.toLowerCase();
  for(let v of vulns){
    if(msg.includes(v.toLowerCase())){
      const i=vulnInfo[v];
      return `${v}: ${i.desc} 
      Cause: ${i.cause} 
      
      Fix: ${i.fix} Along with this proper fix with example is given in the table.
      
      Impact: ${i.impact}`;
    }
  }
  return "Ask me about a specific vulnerability, its cause, fix, or security impact.";
}

function askAI(){
  const q=userQuery.value;
  if(!q)return;
  chatBox.innerHTML+=`<div class='chatMessage user'>You: ${q}</div>`;
  chatBox.innerHTML+=`<div class='chatMessage bot'>🤖 ${aiReply(q)}</div>`;
  chatBox.scrollTop=chatBox.scrollHeight;
}
</script>
</body>
</html>
