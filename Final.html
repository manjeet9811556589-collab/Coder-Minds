<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Vulnerability Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">

<style>
body{
 background:radial-gradient(circle,#06130c,#020705);
 font-family:'Orbitron',monospace;
 color:#00ff88;margin:0;min-height:100vh
}
.wrapper{max-width:1200px;margin:auto;padding:40px}
input,textarea,button{width:100%;padding:12px;margin-top:10px}
input,textarea{background:black;color:#00ff88;border:1px solid #00ff8855}
button{background:#00ff88;border:none;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:20px;display:none}
th,td{border:1px solid #00ff8855;padding:12px;vertical-align:top}
th{background:#011202}
#downloadBtn{display:none}

#chatbotContainer{
 position:fixed;bottom:20px;right:20px;
 width:60px;height:60px;border-radius:50%;
 background:#00ff88;color:black;
 display:flex;align-items:center;justify-content:center;
 font-size:24px;cursor:pointer
}
#chatbotWindow{
 position:fixed;bottom:90px;right:20px;
 width:380px;height:480px;
 background:#020705;border:1px solid #00ff8855;
 border-radius:16px;padding:10px;
 display:none;flex-direction:column
}
#chatbotWindow.show{display:flex}
#chatBox{
 flex:1;overflow-y:auto;background:#011202;
 border:1px solid #00ff8855;border-radius:10px;
 padding:10px
}
.chatMessage.user{color:#00aaff;margin-bottom:10px}
.chatMessage.bot{color:#ffbb33;margin-bottom:10px}
</style>
</head>

<body>
<div class="wrapper">
<h2>⚡ AI Website Vulnerability Scanner</h2>

<input id="urlInput" placeholder="Enter Website URL">
<button onclick="runScan()">RUN RISK ANALYSIS. REFRESH PAGE TO PREDICT FOR NEW URL.</button>

<table id="predictionTable">
<thead>
<tr>
<th>Vulnerability</th>
<th>Prediction</th>
<th>Corrected URL Example</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="finalScore"></div>
<button id="downloadBtn" onclick="downloadCSV()">DOWNLOAD RESULTS</button>
</div>

<div id="chatbotContainer">🤖</div>
<div id="chatbotWindow">
  <div id="chatBox"></div>
  <textarea id="userQuery" placeholder="Ask about causes, impact, fixes, security improvement..."></textarea>
  <button onclick="askAI()">ASK</button>
</div>

<script>
const vulnerabilities=[
"SQL Injection","XSS","Broken Authentication","Sensitive Data Exposure",
"XML External Entities (XXE)","Broken Access Control",
"Security Misconfiguration","CSRF","Vulnerable Components","Insufficient Logging"
];

let safePatterns = JSON.parse(localStorage.getItem("safePatterns")||"[]");

/* ---------- TABLE FIX EXAMPLES ONLY ---------- */
function tableFixExample(url,v){
 const u=new URL(url); const o=u.origin;
 switch(v){
  case "SQL Injection":
   return `Before: ${url} → After: ${o}/product?id=123`;
  case "XSS":
   return `Before: ${url} → After: ${o}/search?q=safeText`;
  case "Broken Authentication":
   return `After: ${o}/secure-login`;
  case "Sensitive Data Exposure":
   return `Before: ${url} → After: ${url.replace("http:","https:")}`;
  case "XML External Entities (XXE)":
   return `After: ${o}/upload (XXE disabled)`;
  case "Broken Access Control":
   return `After: ${o}/dashboard (RBAC enforced)`;
  case "Security Misconfiguration":
   return `After: ${o} (secure headers enabled)`;
  case "CSRF":
   return `After: ${o}/form?token=csrfToken`;
  case "Vulnerable Components":
   return `After: ${o} (libraries updated)`;
  case "Insufficient Logging":
   return `After: ${o} (audit logs enabled)`;
 }
}

/* ---------- CHATBOT KNOWLEDGE ---------- */
function chatbotKnowledge(v,url){
 const base=new URL(url).origin;
 const info={
  "SQL Injection":`Cause: Unsanitized DB input.
Impact: Data theft, DB takeover.
Fix: Parameterized queries.
Security Gain: Blocks malicious SQL execution.`,
  "XSS":`Cause: Unsafe output rendering.
Impact: Session hijack.
Fix: Encode user input.
Security Gain: Prevents script execution.`,
  "Broken Authentication":`Cause: Weak auth flows.
Impact: Account compromise.
Fix: MFA + secure cookies.
Security Gain: Stops takeover.`,
  "Sensitive Data Exposure":`Cause: No encryption.
Impact: Data leaks.
Fix: HTTPS + encryption.
Security Gain: Protects data.`,
  "XML External Entities (XXE)":`Cause: XML entity expansion.
Impact: File disclosure.
Fix: Disable external entities.`,
  "Broken Access Control":`Cause: Missing authorization.
Impact: Privilege escalation.
Fix: RBAC enforcement.`,
  "Security Misconfiguration":`Cause: Insecure defaults.
Impact: Attack surface increase.
Fix: Harden configs.`,
  "CSRF":`Cause: Missing CSRF tokens.
Impact: Forced actions.
Fix: Tokens + SameSite cookies.`,
  "Vulnerable Components":`Cause: Outdated libs.
Impact: Known exploits.
Fix: Patch dependencies.`,
  "Insufficient Logging":`Cause: No monitoring.
Impact: Late breach detection.
Fix: SIEM + alerts.`
 };
 return info[v];
}

/* ---------- PREDICTION ENGINE ---------- */
function score(v,url){
 let s=0.7+Math.random()*0.2;
 if(url.startsWith("https") && v==="Sensitive Data Exposure") s-=0.4;
 if(url.includes("secure") && v==="Broken Authentication") s-=0.3;
 safePatterns.forEach(p=>{ if(url.includes(p)) s-=0.25; });
 return Math.max(0.05,Math.min(0.95,s));
}

function trainSafe(url){
 if(!safePatterns.includes(url)){
  safePatterns.push(url);
  localStorage.setItem("safePatterns",JSON.stringify(safePatterns));
 }
}

function runScan(){
 const url=urlInput.value.trim(); if(!url)return;
 trainSafe(url);

 predictionTable.style.display="table";
 downloadBtn.style.display="block";
 const tb=predictionTable.querySelector("tbody"); tb.innerHTML="";
 let total=0;

 vulnerabilities.forEach(v=>{
  const s=score(v,url); total+=s;
  tb.innerHTML+=`
  <tr>
   <td><b>${v}</b></td>
   <td>${(s*100).toFixed(1)}%</td>
   <td>${tableFixExample(url,v)}</td>
  </tr>`;
 });

 finalScore.innerHTML=`<h3>FINAL RISK SCORE: ${((total/vulnerabilities.length)*100).toFixed(1)}%</h3>`;
 chatbotWindow.classList.add("show");
}

function askAI(){
 const q=userQuery.value.toLowerCase(); if(!q)return;
 chatBox.innerHTML+=`<div class="chatMessage user">You: ${q}</div>`;
 let ans="Ask about a specific vulnerability.";
 vulnerabilities.forEach(v=>{
  if(q.includes(v.toLowerCase())) ans=chatbotKnowledge(v,urlInput.value);
 });
 chatBox.innerHTML+=`<div class="chatMessage bot">🤖 ${ans}</div>`;
 chatBox.scrollTop=chatBox.scrollHeight;
}

chatbotContainer.onclick=()=>chatbotWindow.classList.toggle("show");

function downloadCSV(){
 let csv=["Vulnerability,Prediction,Fix Example"];
 document.querySelectorAll("#predictionTable tbody tr").forEach(r=>{
  let c=r.querySelectorAll("td");
  csv.push(`${c[0].innerText},${c[1].innerText},"${c[2].innerText}"`);
 });
 const b=new Blob([csv.join("\n")],{type:"text/csv"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(b); a.download="vulnerability scan_results.csv"; a.click();
}
</script>
</body>
</html>
